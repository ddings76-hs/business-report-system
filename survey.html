<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프로그램 만족도 조사</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:18px;background:#f4f7f6;color:#1f2937;font-family:"Malgun Gothic",Arial,sans-serif;line-height:1.55;font-size:0}
    body> *:not(#surveyRoot){display:none!important}
    main{max-width:720px;margin:20px auto;background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:26px;box-shadow:0 5px 20px rgba(15,23,42,.08);font-size:14px}
    h1{margin:0 0 10px;padding-bottom:12px;border-bottom:2px solid #2563eb;color:#173f78;font-size:23px}
    .guide{font-size:13px;color:#64748b}
    .question{padding:17px 0;border-bottom:1px solid #e5e7eb}
    .question-title{margin-bottom:9px;font-weight:700}
    .required{color:#dc2626}
    label.choice{display:block;margin:7px 0;padding:5px 6px;border-radius:5px;cursor:pointer}
    label.choice:hover{background:#f1f5f9}
    input[type=radio],input[type=checkbox]{margin-right:6px}
    input[type=text],textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
    input:focus,textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
    textarea{min-height:105px;resize:vertical}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:7px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .notice{padding:18px;border-radius:8px;background:#fff7ed;border:1px solid #fdba74;color:#9a3412}
    .success{padding:20px;border-radius:8px;background:#f0fdf4;border:1px solid #86efac;color:#166534}
    .period{margin:8px 0 0;font-size:12px;color:#64748b}
    #message{margin-top:15px;font-size:13px}
    @media(max-width:600px){body{padding:10px}main{margin:6px auto;padding:19px}h1{font-size:20px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="surveyRoot">
    <h1>설문을 불러오는 중입니다.</h1>
    <p class="guide">잠시만 기다려 주세요.</p>
  </main>
  <script>
  (function(){
    'use strict';
    const SUPABASE_URL='https://quienpvidvkjvtiwyhoq.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1aWVucHZpZHZranZ0aXd5aG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzE0MzIsImV4cCI6MjEwMzgwNzQzMn0.Q2SvpeN2s_okehjVhjNeKpqBCc2ml7EBcmvDMJ4tqKE';
    const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function showNotice(message){
      document.getElementById('surveyRoot').innerHTML='<h1>설문 안내</h1><div class="notice">'+E(message)+'</div>';
    }
    function optionsOf(q){
      if(Array.isArray(q.options))return q.options.map(String);
      if(typeof q.options==='string'){
        try{const v=JSON.parse(q.options);return Array.isArray(v)?v.map(String):[];}
        catch(_){return q.options.split(',').map(x=>x.trim()).filter(Boolean);}
      }
      return [];
    }
    function questionHtml(q,i){
      const name='q_'+i;
      const required=q.required?' <span class="required">*</span>':'';
      let control='';
      if(q.question_type==='rating5'){
        const labels=['전혀 그렇지 않다','그렇지 않다','보통이다','그렇다','매우 그렇다'];
        control=[1,2,3,4,5].map(function(v){
          return '<label class="choice"><input type="radio" name="'+name+'" value="'+v+'"> '+v+'점 ('+labels[v-1]+')</label>';
        }).join('');
      }else if(q.question_type==='single'){
        control=optionsOf(q).map(function(v){
          return '<label class="choice"><input type="radio" name="'+name+'" value="'+E(v)+'"> '+E(v)+'</label>';
        }).join('');
      }else if(q.question_type==='multi'){
        control=optionsOf(q).map(function(v){
          return '<label class="choice"><input type="checkbox" name="'+name+'" value="'+E(v)+'"> '+E(v)+'</label>';
        }).join('');
      }else if(q.question_type==='long'){
        control='<textarea name="'+name+'" maxlength="2000" placeholder="의견을 입력해 주세요."></textarea>';
      }else{
        control='<input type="text" name="'+name+'" maxlength="500" placeholder="응답을 입력해 주세요.">';
      }
      return '<section class="question"><div class="question-title">'+(i+1)+'. '+E(q.question_text)+required+'</div>'+control+'</section>';
    }
    function answerOf(form,q,i){
      const name='q_'+i;
      if(q.question_type==='multi')return Array.from(form.querySelectorAll('[name="'+name+'"]:checked')).map(x=>x.value);
      if(q.question_type==='rating5'||q.question_type==='single')return form.querySelector('[name="'+name+'"]:checked')?.value||'';
      return form.querySelector('[name="'+name+'"]')?.value?.trim()||'';
    }
    function todayLocal(){
      const d=new Date();
      return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    }
    async function boot(){
      const token=new URLSearchParams(location.search).get('survey');
      if(!token){showNotice('설문 주소가 올바르지 않습니다. 안내받은 링크 또는 QR코드로 다시 접속해 주세요.');return;}
      if(!window.supabase){showNotice('설문 서버 연결 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');return;}
      const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      try{
        const surveyQuery=await sb.from('surveys').select('*').eq('public_token',token).single();
        if(surveyQuery.error||!surveyQuery.data)throw new Error('설문을 찾을 수 없습니다.');
        const survey=surveyQuery.data;
        if(survey.status!=='open')throw new Error('현재 응답을 받지 않는 설문입니다.');
        const today=todayLocal();
        if(survey.start_date&&today<survey.start_date)throw new Error('아직 설문 응답 기간이 아닙니다.');
        if(survey.end_date&&today>survey.end_date)throw new Error('설문 응답 기간이 종료되었습니다.');
        const questionQuery=await sb.from('survey_questions').select('*').eq('survey_id',survey.id).order('sort_order',{ascending:true});
        if(questionQuery.error)throw questionQuery.error;
        const questions=questionQuery.data||[];
        if(!questions.length)throw new Error('등록된 설문 문항이 없습니다.');
        document.title=survey.title||'프로그램 만족도 조사';
        const period=survey.start_date||survey.end_date
          ? '<div class="period">응답기간: '+E(survey.start_date||'제한 없음')+' ~ '+E(survey.end_date||'제한 없음')+'</div>':'';
        const root=document.getElementById('surveyRoot');
        root.innerHTML='<h1>'+E(survey.title||'프로그램 만족도 조사')+'</h1>'+
          (survey.description?'<p style="white-space:pre-wrap">'+E(survey.description)+'</p>':'')+
          '<p class="guide">표시된 필수 문항에 모두 응답한 후 제출해 주세요.</p>'+period+
          '<form id="surveyForm" autocomplete="off">'+questions.map(questionHtml).join('')+
          '<button id="submitButton" type="submit">응답 제출</button></form>'+
          '<div id="message" role="status" aria-live="polite"></div>';
        const form=document.getElementById('surveyForm');
        form.addEventListener('submit',async function(event){
          event.preventDefault();
          const message=document.getElementById('message');
          const button=document.getElementById('submitButton');
          try{
            const answers=questions.map((q,i)=>({question_id:q.id,answer:answerOf(form,q,i)}));
            for(let i=0;i<questions.length;i++){
              const answer=answers[i].answer;
              if(questions[i].required&&(answer===''||answer==null||(Array.isArray(answer)&&!answer.length))){
                throw new Error((i+1)+'번 문항은 필수입니다.');
              }
            }
            button.disabled=true;button.textContent='제출 중...';message.textContent='';
            const result=await sb.rpc('submit_public_survey_v1091',{p_token:token,p_answers:answers});
            if(result.error)throw result.error;
            form.style.display='none';
            message.innerHTML='<div class="success"><h2 style="margin-top:0">응답이 제출되었습니다.</h2><p>설문에 참여해 주셔서 감사합니다.</p></div>';
          }catch(error){
            message.style.color='#b91c1c';
            message.textContent='제출 오류: '+(error.message||error);
            button.disabled=false;button.textContent='응답 제출';
          }
        });
      }catch(error){showNotice(error.message||error);}
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
    else boot();
  })();
  </script>
</body>
</html>
